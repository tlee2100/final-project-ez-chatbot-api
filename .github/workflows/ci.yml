name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  img_name: chatbot-api

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure runner DNS
        run: bash .github/scripts/configure-runner-dns.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      - name: Log in to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set image name
        id: image
        run: |
          registry="${{ secrets.DOCKER_REGISTRY_URL }}"
          tag="${{ github.run_number }}"
          image="${registry}/internship/${{ env.img_name }}:${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy
    needs: build-docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out deployment helper
        uses: actions/checkout@v6

      - name: Deploy to Coolify
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_MODE: docker-image
          IMAGE_TAG: ${{ needs.build-docker-image.outputs.tag }}
          DEPLOY_IMAGE: ${{ needs.build-docker-image.outputs.image }}
          RELEASE_VERSION: ${{ needs.build-docker-image.outputs.tag }}
        run: bash .github/scripts/deploy-coolify.sh
