name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  img_name: chatbot-api
jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Set image name
        id: image
        run: |
          registry="${{ secrets.DOCKER_REGISTRY_URL }}"
          image="${registry}/internship/${{ env.img_name }}:${{ github.run_number }}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install CapRover CLI
        run: npm install -g caprover@2.3.1

      - name: Deploy image to CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP: ez-chatbot-api
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          caprover deploy \
            --caproverUrl "$CAPROVER_URL" \
            --caproverPassword "$CAPROVER_PASSWORD" \
            --caproverApp "$CAPROVER_APP" \
            --imageName "$IMAGE"
