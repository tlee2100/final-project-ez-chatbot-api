name: Manual CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run CI on
        required: true
        default: testing
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Run CI on selected branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: gh workflow run ci.yml --repo "$GH_REPO" --ref "$BRANCH"
